services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_second_brain
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=34.9.239.8.nip.io
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      # Reemplaza con tu IP externa de Google Cloud
      - WEBHOOK_URL=http://34.9.239.8.nip.io/
      - GENERIC_TIMEZONE=Europe/Madrid
      # Optimización de memoria para máquinas pequeñas (GCE e2-micro/small)
      - NODE_OPTIONS=--max-old-space-size=1024
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
    volumes:
      # Usamos la ruta relativa al directorio actual
      - ./n8n_data:/home/node/.n8n

networks:
  default:
    name: second-brain-network
